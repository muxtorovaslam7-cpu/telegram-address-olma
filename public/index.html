<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do'konlar xaritasi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --accent2: #2fbf71;
    --danger: #ff5b5b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; }
  .count {
    background: var(--accent2);
    color: #04150b;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 13px;
    margin-left: 8px;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary { background: #2a2f3a; }
  button:hover { opacity: 0.9; }
  #map { flex: 1; width: 100%; min-height: 400px; background: #1a1d24; }

  .banner {
    background: #1d3a5f;
    color: #bcdcff;
    padding: 8px 16px;
    font-size: 13px;
    display: none;
  }
  .banner.show { display: block; }

  /* Leaflet popup ni tema bilan moslashtirish */
  .leaflet-popup-content-wrapper {
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
  }
  .leaflet-popup-tip { background: var(--card); }
  .popup-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .popup-meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .popup-dist { font-size: 13px; margin-bottom: 8px; }
  .popup-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .popup-actions a, .popup-actions button {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    text-decoration: none;
    display: inline-block;
  }
  .btn-route { background: var(--accent); color: white; }
  .btn-del { background: var(--danger); color: white; border: none; cursor: pointer; }

  /* Qizil nuqta marker */
  .red-dot {
    width: 18px;
    height: 18px;
    background: #ff3b3b;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,59,59,0.8);
  }
  .red-dot-label {
    position: relative;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff3b3b;
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Do'konlar xaritasi <span class="count" id="count">0</span></h1>
  <div class="controls">
    <button id="addModeBtn">➕ Xaritadan do'kon qo'shish</button>
    <button class="secondary" id="myLocBtn">📍 Mening joyim</button>
  </div>
</header>

<div class="banner" id="addBanner">Xaritada kerakli joyga bosing — shu yerga do'kon qo'shiladi.</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([41.311081, 69.240562], 12); // Toshkent markazi

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let markersLayer = L.layerGroup().addTo(map);
let userPos = null; // {lat, lng}
let addMode = false;

const countEl = document.getElementById('count');
const addModeBtn = document.getElementById('addModeBtn');
const addBanner = document.getElementById('addBanner');
const myLocBtn = document.getElementById('myLocBtn');

function redIcon(label) {
  return L.divIcon({
    className: '',
    html: `<div style="text-align:center;">
             <div class="red-dot"></div>
             <div class="red-dot-label">#${label}</div>
           </div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9],
  });
}

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLng/2) * Math.sin(dLng/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function getUserLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}

async function buildPopupContent(shop) {
  const container = document.createElement('div');
  const date = new Date(shop.updatedAt).toLocaleString('uz-UZ');

  let distanceHtml = '<div class="popup-dist">Masofani ko\'rish uchun joylashuvga ruxsat bering</div>';

  if (!userPos) {
    userPos = await getUserLocation();
  }

  if (userPos) {
    const straightKm = haversineKm(userPos.lat, userPos.lng, shop.lat, shop.lng);
    distanceHtml = `<div class="popup-dist">📏 To'g'ri chiziq: ~${straightKm.toFixed(2)} km</div>`;
  }

  const gmapsUrl = userPos
    ? `https://www.google.com/maps/dir/?api=1&origin=${userPos.lat},${userPos.lng}&destination=${shop.lat},${shop.lng}`
    : `https://www.google.com/maps/search/?api=1&query=${shop.lat},${shop.lng}`;

  container.innerHTML = `
    <div class="popup-title">🏪 Do'kon #${shop.number}</div>
    <div class="popup-meta">${shop.author || ''} • ${date}</div>
    ${distanceHtml}
    <div class="popup-actions">
      <a class="btn-route" href="${gmapsUrl}" target="_blank" rel="noopener">🧭 Yo'nalish (Google Maps)</a>
      <button class="btn-del" data-number="${shop.number}">✕ O'chirish</button>
    </div>
  `;

  container.querySelector('.btn-del').addEventListener('click', async (e) => {
    const num = e.target.dataset.number;
    if (confirm(`Do'kon #${num} o'chirilsinmi?`)) {
      await fetch('/api/shops/' + encodeURIComponent(num), { method: 'DELETE' });
      loadShops();
    }
  });

  return container;
}

async function loadShops() {
  const res = await fetch('/api/shops');
  const shops = await res.json();
  countEl.textContent = shops.length;

  markersLayer.clearLayers();
  shops.forEach(shop => {
    const marker = L.marker([shop.lat, shop.lng], { icon: redIcon(shop.number) });
    marker.on('click', async () => {
      const content = await buildPopupContent(shop);
      marker.bindPopup(content).openPopup();
    });
    marker.addTo(markersLayer);
  });
}

// --- Xaritadan qo'lda do'kon qo'shish ---
addModeBtn.addEventListener('click', () => {
  addMode = !addMode;
  addBanner.classList.toggle('show', addMode);
  addModeBtn.textContent = addMode ? '❌ Bekor qilish' : '➕ Xaritadan do\'kon qo\'shish';
});

map.on('click', async (e) => {
  if (!addMode) return;
  const number = prompt("Do'kon raqamini kiriting:");
  if (!number || !number.trim()) return;
  const author = prompt("Ismingiz (ixtiyoriy):") || '';
  await fetch('/api/shops', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      number: number.trim(),
      lat: e.latlng.lat,
      lng: e.latlng.lng,
      author
    })
  });
  addMode = false;
  addBanner.classList.remove('show');
  addModeBtn.textContent = '➕ Xaritadan do\'kon qo\'shish';
  loadShops();
});

// --- "Mening joyim" tugmasi ---
myLocBtn.addEventListener('click', async () => {
  const pos = await getUserLocation();
  if (!pos) {
    alert("Joylashuvni aniqlab bo'lmadi. Brauzer ruxsatini tekshiring.");
    return;
  }
  userPos = pos;
  map.setView([pos.lat, pos.lng], 15);
  L.circleMarker([pos.lat, pos.lng], {
    radius: 8,
    color: '#4f8cff',
    fillColor: '#4f8cff',
    fillOpacity: 0.8
  }).addTo(map).bindPopup('📍 Siz shu yerdasiz').openPopup();
});

loadShops();
setInterval(loadShops, 8000); // Telegramdan kelgan yangi do'konlarni avtomatik yangilab turish
</script>
</body>
</html>
